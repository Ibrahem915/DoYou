<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Testing Position Skills</title>
  </head>
  <body>
        <main class="mainSection">
          <h1 class="doYou" id="question">Do You Love Me?</h1>
          <button type="button" id="noBtn" class="btn Absolute">NO</button>
          <button type="button" id="yesBtn" class="btn Absolute">Yes</button>
          <button id="resetBtn" class="hidden btn Absolute">reset</button>
          <dialog id="dialogName" class="dialog">
              <form>
                <label>Enter Your Name:</label>
                <input type="text" name="name" id="nameInput">                
                <button type="button" class="btn submit" id="enter">Enter</button>
              </form>
          </dialog>
        </main>
        <script src="https://cdn.jsdelivr.net/npm/js-confetti@latest/dist/js-confetti.browser.js"></script>
        <script src="./script.js"></script>

  </body>
</html>
